[project]
name = "trend-vista-ai-backend"
version = "0.1.0"
description = "TrendVista AI - バックエンドAPI（FastAPI）"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "structlog>=24.0.0",
    "feedparser>=6.0.0",
    "janome>=0.5.0",
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "fugashi>=1.3.0",
    "unidic-lite>=1.0.8",
    "atproto>=0.0.46",
    "python-dotenv>=1.0.0",
    "requests>=2.28.0",
    "llama-cpp-python>=0.2.0",
    "huggingface-hub>=0.20.0",
    "wordcloud>=1.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "SIM", "TCH", "RUF"]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
